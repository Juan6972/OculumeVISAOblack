  (function () {
    function getDeliveryDate(businessDays) {
      var date = new Date();
      var added = 0;
      while (added < businessDays) {
        date.setDate(date.getDate() + 1);
        var d = date.getDay();
        if (d !== 0 && d !== 6) added++;
      }
      return date;
    }
    function formatDate(dateObj) {
      return dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function initDeliveryDates() {
      var dateStr = formatDate(getDeliveryDate(3));
      document.querySelectorAll('.delivery-date').forEach(function (el) {
        el.innerHTML = 'Order now & receive by <span class="when">' + dateStr + '</span>!';
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initDeliveryDates);
    } else {
      initDeliveryDates();

  })();
</script>
